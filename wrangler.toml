name = "superpadel"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Le jeu (dossier public/) est servi par le même Worker
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite : compatible avec le plan gratuit de Cloudflare
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
